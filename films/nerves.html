<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why are your nerves wrapped in fat? (film)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Martian+Mono:wdth,wght@87.5,400;87.5,600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>html, body { margin: 0; background: #0d1015; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script type="module">
// A 4:5 film of the explorable at /explorables/nerves/, drawn with its own pictures (pictures.js)
// from one race of its three live nerves, at one steady slow motion (5000×): a thin bare nerve,
// the same one wrapped in myelin, and a squid's giant one. Rendered one frame per call of
// window.reel.frame(k) by driftlet's tools/film.js (--root at this site), with a soundtrack made
// from what the nerves did (sound.js).

import { Nerve, KINDS, NODE, L } from '../src/explorables/nerves/model.js';
import { COL, span, drawRace, drawWave } from '../src/explorables/nerves/pictures.js';
import { render } from './sound.js';

Object.assign(COL, {
  bg: '#0d1015', surface: '#151a22', line: '#252c38', 'line-2': '#313a48', ink: '#ece7dc', 'ink-2': '#c4bfb4', muted: '#8a909b',
  axon: '#1d232c', outside: '#0f2630', spike: '#ffd166', 'spike-glow': 'rgba(255, 209, 102, .9)', sheath: '#efdcae', 'sheath-line': '#b9a473',
  bare: '#c4bfb4', myelin: '#f3d58c', squid: '#55b8ff', na: '#ff6b4a', k: '#a78bfa', cl: '#5ed39a',
});
const W = 1080, H = 1350, FPS = 30, PACE = 0.2e-3, ctx = document.getElementById('c').getContext('2d');
const S = 1.125; // the pictures' 960-wide pages, scaled to the frame
// The story, in seconds of film; the race is fired at FIRE and runs at PACE from there.
const FIRE = 2.6;
const PHASES = [
  { key: 'question', until: FIRE },
  { key: 'wrapped', until: FIRE + 2.6 }, // the wrapped nerve arrives at about 0.48 ms: 2.4 s
  { key: 'squid', until: FIRE + 6.6 }, // the squid's at about 1.26 ms: 6.3 s
  { key: 'bare', until: FIRE + 9.6 },
  { key: 'end', until: FIRE + 13 },
];
const frames = Math.round(PHASES.at(-1).until * FPS);
const phaseAt = (t) => PHASES.find((p) => t < p.until) ?? PHASES.at(-1);

let nerves, k0, heard, prevNode;
function reset() {
  nerves = Object.fromEntries(KINDS.map((k) => [k, new Nerve(k)]));
  heard = { ticks: [], crackle: [], arrive: [], clicks: [], swell: [], swellPan: [] };
  prevNode = null;
  k0 = -1;
}
reset();
const step = NODE + nerves.myelin.p.gap;
const nodeX = Array.from({ length: Math.floor(nerves.myelin.end / step) + 1 }, (_, i) => i * step + NODE / 2);
// membrane voltage at x in a nerve (the outside is at φ = 0)
function vm(n, x) {
  const S = n.solution, xs = S.x;
  let g = xs.findIndex((v) => v >= x);
  if (g <= 0) return S.phi[Math.max(0, g)];
  return S.phi[g - 1] + ((x - xs[g - 1]) / (xs[g] - xs[g - 1])) * (S.phi[g] - S.phi[g - 1]);
}

// Captions: a headline and a line under it.
function caption(key) {
  if (key === 'wrapped') return ['Bare, and wrapped in fat', 'The same thin nerve twice. Wrapped, its signal jumps from gap to gap.'];
  if (key === 'squid') return ["A squid's nerve is 48× wider", 'Thickening a nerve speeds it up too. It still loses to the thin wrapped one.'];
  if (key === 'bare') return ['The bare one is still crawling', 'Over ten times slower than wrapped. That’s why your nerves wear fat.'];
  return ['Simulated, not drawn', 'Every frame is solved from the physics. Try it: link below.'];
}
function wrap(text, width) {
  const words = text.split(' '), lines = [];
  let line = '';
  for (const w of words) { const t = line ? `${line} ${w}` : w; if (ctx.measureText(t).width > width && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  return lines;
}

function draw(k) {
  const t = k / FPS, ph = phaseAt(t), key = ph.key, start = PHASES[PHASES.indexOf(ph) - 1]?.until ?? 0, j = (t - start) * FPS;
  const g = ctx.createRadialGradient(W * 0.7, -80, 50, W * 0.7, -80, 1100);
  g.addColorStop(0, '#161b24');
  g.addColorStop(1, COL.bg);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  // the pictures
  const race = { ctx, VW: 960, VH: 420 }, wave = { ctx, VW: 960, VH: 400 };
  span(race);
  ctx.save(); ctx.translate(0, 300); ctx.scale(S, S); drawRace(race, nerves, { pace: '5000×', over: t > PHASES[2].until - 0.6 }); ctx.restore();
  ctx.save(); ctx.translate(0, 800); ctx.scale(S, S); drawWave(wave, nerves); ctx.restore();
  // the headline
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  if (key === 'question') {
    ctx.globalAlpha = Math.min(1, j / 6);
    ctx.fillStyle = COL.na;
    ctx.font = '600 22px "Martian Mono", monospace';
    ctx.fillText('A NERVE SIGNAL, SIMULATED', 64, 78);
    ctx.font = '900 96px "Big Shoulders Display", sans-serif';
    ctx.fillStyle = COL.ink;
    ctx.fillText('WHY ARE YOUR NERVES', 60, 170);
    const a = 'WRAPPED IN ', b = 'FAT', c = '?';
    ctx.fillText(a, 60, 258);
    const x = 60 + ctx.measureText(a).width;
    ctx.fillStyle = COL.myelin; ctx.fillText(b, x, 258);
    ctx.fillStyle = COL.ink; ctx.fillText(c, x + ctx.measureText(b).width, 258);
    ctx.globalAlpha = 1;
  } else {
    const [head, sub] = caption(key);
    ctx.globalAlpha = Math.min(1, j / 8);
    ctx.fillStyle = key === 'squid' ? COL.squid : key === 'bare' ? COL.bare : key === 'wrapped' ? COL.myelin : COL.ink;
    ctx.font = '900 76px "Big Shoulders Display", sans-serif';
    ctx.fillText(head.toUpperCase(), 60, 122);
    ctx.fillStyle = COL['ink-2'];
    ctx.font = '400 31px "Newsreader", serif';
    wrap(sub, 960).forEach((s, i) => ctx.fillText(s, 62, 176 + 40 * i));
    if (key === 'end') {
      ctx.fillStyle = COL.na;
      ctx.font = '600 22px "Martian Mono", monospace';
      ctx.fillText('MADE BY MARK LUNDEBERG & CLAUDE · ON DRIFTLET', 64, 238);
    }
    ctx.globalAlpha = 1;
  }
  // the footer
  ctx.font = '400 24px "Martian Mono", monospace';
  ctx.fillStyle = COL.muted;
  ctx.textBaseline = 'middle';
  ctx.fillText(key === 'end' ? 'nerves 2 cm long · Hodgkin–Huxley channels' : 'slowed down 5000×', 64, 1308);
  ctx.textAlign = 'right';
  ctx.fillStyle = key === 'end' ? COL.ink : COL.muted;
  ctx.font = `${key === 'end' ? 600 : 400} 22px "Martian Mono", monospace`;
  ctx.fillText(key === 'end' ? 'marklundeberg.com' : 'driftlet', W - 60, 1308);
}

// Frame k: the race moves on to it (frames are taken in order), what it did is noted for the
// soundtrack, and it's drawn.
function frame(k) {
  if (k < k0) reset();
  for (let i = k0 + 1; i <= k; i++) {
    const t = i / FPS;
    if (t >= FIRE && nerves.bare.fired === null) { for (const n of Object.values(nerves)) n.fire(); heard.clicks.push({ t }); }
    if (nerves.bare.fired !== null) {
      const was = Object.fromEntries(KINDS.map((kk) => [kk, nerves[kk].arrived]));
      for (const n of Object.values(nerves)) n.advance((t - FIRE) * PACE);
      for (const kk of ['myelin', 'squid']) if (was[kk] === null && nerves[kk].arrived !== null) heard.arrive.push({ t, x: 1 });
      // a tick at each node of the wrapped nerve as it fires
      const v = nodeX.map((x) => vm(nerves.myelin, x));
      if (prevNode) v.forEach((u, n) => { if (prevNode[n] < -0.03 && u >= -0.03) heard.ticks.push({ t, x: nodeX[n] / L }); });
      prevNode = v;
      // a crackle where the bare nerve is firing, a swell where the squid's is
      const bf = nerves.bare.front, sq = nerves.squid;
      heard.crackle.push(bf !== null && nerves.bare.time < 8e-3 ? { t, x: bf / L } : null);
      const peak = Math.max(...Array.from(sq.solution.phi)), xs = sq.solution.x, at = xs[Array.from(sq.solution.phi).indexOf(peak)];
      heard.swell[i] = sq.arrived === null || sq.time < sq.arrived + 0.15e-3 ? Math.max(0, Math.min(1, (peak + 0.03) / 0.07)) : 0;
      heard.swellPan[i] = 1.5 * (at / L - 0.5);
    } else { heard.swell[i] = 0; heard.swellPan[i] = -0.75; }
  }
  k0 = k;
  draw(k);
}

// The soundtrack: from what the frames did (so after they've all been taken, in order).
const mulberry = (seed) => () => ((seed = (seed + 0x6d2b79f5) | 0), (((seed ^ (seed >>> 15)) * (1 | seed)) >>> 0) / 4294967296);
function audio() {
  const rnd = mulberry(5), pan = (x) => 1.5 * (x - 0.5);
  console.log(`sound: ${heard.ticks.length} node ticks, ${heard.crackle.filter(Boolean).length} crackle frames, ${heard.arrive.length} arrivals`);
  const crackle = [];
  for (const c of heard.crackle) if (c) for (let n = 0; n < 3; n++) crackle.push({ t: c.t + rnd() / FPS, f: 1800 + 1600 * rnd(), pan: pan(c.x), gain: 0.025 + 0.025 * rnd() });
  return render({
    seconds: frames / FPS,
    master: 1.3,
    drops: heard.ticks.map((d) => ({ t: d.t, f: 1250 * 2 ** (0.1 * (rnd() - 0.5)), pan: pan(d.x), gain: 0.22 })),
    toks: [...crackle, ...heard.arrive.map((a) => ({ t: a.t, f: 520, pan: pan(a.x), gain: 0.25 }))],
    clicks: heard.clicks.map((c) => ({ t: c.t, gain: 0.45 })),
    beds: [{ kind: 'rush', fps: FPS, f: 260, gain: heard.swell.map((v) => 0.3 * v), pan: heard.swellPan }],
  });
}
await document.fonts.load('900 96px "Big Shoulders Display"');
await document.fonts.load('400 31px "Newsreader"');
await document.fonts.load('600 22px "Martian Mono"');
window.reel = { frames, fps: FPS, frame, audio };
frame(0);
</script>
</body>
</html>
