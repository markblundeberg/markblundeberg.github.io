<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transistor card (og.png)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Martian+Mono:wdth,wght@87.5,400;87.5,600&display=swap">
<style>html, body { margin: 0; background: #0d1015; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script type="module">
// The transistor explorable's link card, 1200 × 630: the question over the switch with its gate at
// 0.6 V, 1.6 s of electrons crossing. One frame, taken by driftlet's tools/film.js --png; copied to
// src/explorables/transistor/og.png.

import { Gate, ZERO_CHARGE, sweep, profile, climb } from '../src/explorables/transistor/model.js';
import { COL, stepFlow, drawSwitch } from '../src/explorables/transistor/pictures.js';

Object.assign(COL, {
  bg: '#0d1015', surface: '#151a22', line: '#252c38', 'line-2': '#313a48', ink: '#ece7dc', 'ink-2': '#c4bfb4', muted: '#8a909b',
  e: '#5aa7e8', h: '#f0793f', gate: '#e0a64a', ox: '#3a4252', climb: '#b58cff', frame: '#7d8796',
});
const W = 1200, H = 630, ctx = document.getElementById('c').getContext('2d');
const r = new Gate(ZERO_CHARGE).at(0.6);
const st = { V: 0.6, sweep: sweep(ZERO_CHARGE), here: { V: 0.6, n: r.n, climb: climb(r.S), profile: profile(r.S) } };
for (let k = 0; k < 48; k++) stepFlow(st, 1 / 30);
await document.fonts.load('900 64px "Big Shoulders Display"');
await document.fonts.load('600 20px "Martian Mono"');
function frame() {
  const g = ctx.createRadialGradient(W * 0.5, -80, 50, W * 0.5, -80, 1100);
  g.addColorStop(0, '#1a1c22');
  g.addColorStop(1, COL.bg);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const s = 1.2;
  ctx.save(); ctx.translate((W - 960 * s) / 2, 175); ctx.scale(s, s);
  drawSwitch({ ctx, VW: 960, VH: 380, ts: 1.3 }, st, { clear: false });
  ctx.restore();
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  ctx.fillStyle = COL.gate;
  ctx.font = '600 20px "Martian Mono", monospace';
  ctx.fillText('ONE TRANSISTOR, SIMULATED', 66, 52);
  ctx.font = '900 64px "Big Shoulders Display", sans-serif';
  ctx.fillStyle = COL.ink; ctx.fillText('WHY CAN’T AI CHIPS JUST RUN', 62, 118);
  const a = 'AT A LOWER ', b = 'VOLTAGE', c = '?';
  ctx.fillText(a, 62, 180);
  let x = 62 + ctx.measureText(a).width;
  ctx.fillStyle = COL.gate; ctx.fillText(b, x, 180);
  x += ctx.measureText(b).width;
  ctx.fillStyle = COL.ink; ctx.fillText(c, x, 180);
}
window.reel = { frames: 1, fps: 1, width: W, height: H, frame };
frame();
</script>
</body>
</html>
