<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROBLEM SET ∞ Demo</title>
<meta name="description" content="A small puzzle game from the anime opening PROBLEM SET ∞: seven short puzzles with Professor Hilde, from the r's in strawberry to a real little proof, then a padlocked trunk of open questions.">
<link rel="canonical" href="https://marklundeberg.com/problem-set/game/">
<meta property="og:type" content="website">
<meta property="og:title" content="PROBLEM SET ∞ Demo">
<meta property="og:description" content="A small puzzle game from the anime opening PROBLEM SET ∞: seven short puzzles with Professor Hilde, from the r's in strawberry to a real little proof, then a padlocked trunk of open questions.">
<meta property="og:url" content="https://marklundeberg.com/problem-set/game/">
<meta property="og:image" content="https://marklundeberg.com/problem-set/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="Mark Lundeberg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://marklundeberg.com/problem-set/og.jpg">
<link rel="icon" href="/img/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="game.css">

</head>
<body>
<main class="stage">
  <div class="device" id="device">
    <div class="device-bar">
      <span class="brand">PROBLEM SET <b>∞</b></span>
      <button class="mute" id="mute" type="button" aria-pressed="false">Sound on</button>
    </div>

    <div class="left">
    <section class="screen top-screen" id="topScreen" aria-label="Story screen">
      <canvas id="top" width="1280" height="720" aria-hidden="true"></canvas>
      <div class="dlg" id="dlg" hidden>
        <div class="dlg-tab" id="dlgName">Professor Hilde</div>
        <p class="dlg-text" id="dlgText"></p>
        <span class="dlg-more" aria-hidden="true"></span>
      </div>
      <p class="sr-only" id="dlgLive" aria-live="polite"></p>
      <div class="coin-pop" id="coinPop" hidden>+1 hint coin</div>
    </section>
    <div class="pad" aria-hidden="true">
      <div class="dpad"><span></span></div>
      <div class="pills"><span>SELECT</span><span>START</span></div>
      <div class="ab"><button class="b-btn" id="bBtn" type="button" tabindex="-1">B</button><button class="a-btn" id="aBtn" type="button" tabindex="-1">A</button></div>
    </div>
    </div>

    <div class="hinge" aria-hidden="true"><span></span><span></span></div>

    <section class="screen bottom-screen" id="bottom" aria-label="Puzzle screen">
      <div class="view" id="view"></div>
      <div class="actions" id="actions"></div>
    </section>
  </div>
  <p class="foot">A demo of the puzzle game from the anime opening <a href="https://www.youtube.com/watch?v=Ly3z1gI2g20"><i>We Will Know</i></a>. Your progress stays in this browser. <a href="../">How it was made</a> · <a href="/">Mark Lundeberg</a></p>
</main>

<script src="core.js"></script>
<script src="chars.js"></script>
<script src="bg.js"></script>
<script src="fx.js"></script>
<script src="puzzles.js"></script>
<script src="handheld.js"></script>
<script src="art.js"></script>
<script src="audio.js"></script>
<script src="content.js"></script>
<script src="shell.js"></script>
</body>
</html>
