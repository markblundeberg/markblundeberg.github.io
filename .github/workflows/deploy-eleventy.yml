# .github/workflows/deploy-eleventy.yml

name: Deploy Eleventy Site to GitHub Pages

on:
    # Runs on pushes targeting the main branch
    push:
        branches: ['master']

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    # Build job
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (SHA-pinned)

            - name: Setup Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (SHA-pinned)
              with:
                  node-version: '20' # Specify your desired Node.js version
                  cache: 'npm' # Enable caching for npm dependencies

            - name: Install dependencies
              run: npm ci --production

            - name: Build with Eleventy
              run: npx @11ty/eleventy # Run Eleventy build command
              #env:
              # Optional: Set environment variables if needed by your build
              # ELEVENTY_ENV: production

            - name: Setup Pages
              uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0 (SHA-pinned)

            - name: Upload artifact
              uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1 (SHA-pinned)
              with:
                  # Upload the default output directory from Eleventy
                  path: './_site'

    # Deployment job
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build # Depends on the build job completing successfully
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (SHA-pinned)

